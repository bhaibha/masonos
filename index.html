<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The .ico first and unconditionally, because it is what a browser asks
         for at /favicon.ico whatever the markup says, and it carries 16/32/48.
         The 32px PNG is the one modern browsers actually pick. favicon.svg is
         the old generic mark and is deliberately no longer referenced. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Charcoal, matching the logo tile rather than the page. The app itself
         is cream; this colours the phone's address/status bar so the chrome
         above the app reads as part of the brand. -->
    <meta name="theme-color" content="#1A1A18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="YMS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>YMS — Your Masons</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
